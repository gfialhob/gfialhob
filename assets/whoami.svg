<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e6edf3; }
      .font-code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 13.5px; }
      .prompt { fill: #00995d; font-weight: 700; }
      .cmd { fill: #e6edf3; }
      .header-user { fill: #00d26a; font-weight: 700; font-size: 15px; }
      .header-at { fill: #8b949e; font-weight: 700; font-size: 15px; }
      .sep { fill: #30363d; }
      .key { fill: #00995d; font-weight: 700; }
      .val { fill: #e6edf3; }
      .muted { fill: #8b949e; }
    </style>

    <clipPath id="window-clip">
      <rect x="2" y="2" width="896" height="336" rx="10" ry="10" />
    </clipPath>
  </defs>

  <!-- Fundo da janela -->
  <rect x="2" y="2" width="896" height="336" rx="10" ry="10" fill="#0a0a0a" />

  <g clip-path="url(#window-clip)">
    <!-- Barra de titulo -->
    <rect x="2" y="2" width="896" height="36" fill="#111111" />
    <text x="22" y="24" text-anchor="start" class="font-title">gfialhob@github: ~</text>

    <!-- Botoes da janela a direita -->
    <circle cx="830" cy="19" r="6" fill="#8b949e" />
    <circle cx="850" cy="19" r="6" fill="#8b949e" />
    <path d="M 868 15 L 876 23 M 876 15 L 868 23" stroke="#8b949e" stroke-width="2" stroke-linecap="round" />

    <g class="font-code">
      <!-- Comando inicial -->
      <text x="26" y="66">
        <tspan class="prompt">gfialhob@github:~$</tspan>
        <tspan class="cmd"> neofetch --profile</tspan>
      </text>

      <!-- COLUNA ESQUERDA: Monograma "GF" estilo ANSI Shadow (vetorial, 100% alinhado no centro x=150) -->
      <g transform="translate(68, 92)">
        <!-- === LETRA G (x: 0..74, y: 0..92) === -->
        <!-- Sombra 3D (offset +5, +5) -->
        <path d="M 14 5 H 74 V 21 H 21 V 77 H 58 V 55 H 40 V 41 H 74 V 93 H 14 L 5 84 V 14 Z" fill="none" stroke="#0d3b29" stroke-width="2.5" stroke-linejoin="round" />
        <!-- Frente solida em verde -->
        <path d="M 10 0 H 70 V 16 H 16 V 72 H 54 V 50 H 36 V 36 H 70 V 88 H 10 L 0 78 V 10 Z" fill="#00d26a" />
        <!-- Degrade inferior na letra G -->
        <path d="M 0 46 H 16 V 72 H 54 V 50 H 36 V 36 H 70 V 88 H 10 L 0 78 Z" fill="#00995d" />

        <!-- === LETRA F (x: 90..164, y: 0..92) === -->
        <!-- Sombra 3D (offset +5, +5) -->
        <path d="M 95 5 H 165 V 21 H 111 V 41 H 153 V 57 H 111 V 93 H 95 Z" fill="none" stroke="#0d3b29" stroke-width="2.5" stroke-linejoin="round" />
        <!-- Frente solida em verde -->
        <path d="M 90 0 H 160 V 16 H 106 V 36 H 148 V 52 H 106 V 88 H 90 Z" fill="#00d26a" />
        <!-- Degrade inferior na letra F -->
        <path d="M 90 46 H 106 V 88 H 90 Z" fill="#00995d" />
      </g>

      <!-- Legendas centralizadas exatamente abaixo do GF (x=150) -->
      <text x="150" y="216" text-anchor="middle" class="muted">[ root@gfialho ]</text>
      <text x="150" y="236" text-anchor="middle" class="muted">automatizar · resolver</text>

      <!-- Divisor vertical subtil -->
      <line x1="295" y1="88" x2="295" y2="274" stroke="#21262d" stroke-width="1.5" />

      <!-- COLUNA DIREITA: Ficha Tecnica estilo System Info -->
      <text x="325" y="104">
        <tspan class="header-user">Gabriel Fialho</tspan>
        <tspan class="header-at"> // </tspan>
        <tspan class="muted">gfialhob</tspan>
      </text>
      <text x="325" y="122" class="sep">--------------------------------------------------</text>

      <text x="325" y="144">
        <tspan class="key">Atuação:   </tspan>
        <tspan class="val">Dev | Infra e Suporte | Cloud | IA</tspan>
      </text>

      <text x="325" y="166">
        <tspan class="key">Momento:   </tspan>
        <tspan class="val">Transição para tech (1ª vaga Remoto/Híbrido)</tspan>
      </text>

      <text x="325" y="188">
        <tspan class="key">Perfil:    </tspan>
        <tspan class="val">Causa raiz, automação e aprendizado na prática</tspan>
      </text>

      <text x="325" y="210">
        <tspan class="key">Cert:      </tspan>
        <tspan class="val">AWS Certified Cloud Practitioner</tspan>
      </text>

      <text x="325" y="232">
        <tspan class="key">Base:      </tspan>
        <tspan class="val">Araruama, RJ - Brasil</tspan>
      </text>

      <!-- Paleta de blocos do tema -->
      <g transform="translate(325, 252)">
        <rect x="0" y="0" width="22" height="12" rx="2" fill="#161b22" />
        <rect x="26" y="0" width="22" height="12" rx="2" fill="#0d3b29" />
        <rect x="52" y="0" width="22" height="12" rx="2" fill="#14532d" />
        <rect x="78" y="0" width="22" height="12" rx="2" fill="#00995d" />
        <rect x="104" y="0" width="22" height="12" rx="2" fill="#00d26a" />
        <rect x="130" y="0" width="22" height="12" rx="2" fill="#8b949e" />
        <rect x="156" y="0" width="22" height="12" rx="2" fill="#e6edf3" />
      </g>

      <!-- Linha final com cursor -->
      <text x="26" y="312">
        <tspan class="prompt">gfialhob@github:~$</tspan>
      </text>
      <rect x="180" y="298" width="9" height="17" fill="#e6edf3">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Borda externa verde -->
  <rect x="2" y="2" width="896" height="336" rx="10" ry="10" fill="none" stroke="#00995d" stroke-width="1" />
</svg>