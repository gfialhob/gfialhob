<svg width="900" height="145" viewBox="0 0 900 145" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e6edf3; }
      .font-code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 14px; }
      .prompt { fill: #00995d; font-weight: 700; }
      .cmd { fill: #e6edf3; }
      .dir { fill: #58a6ff; font-weight: 700; }
      .text { fill: #c9d1d9; }
      .subtext { fill: #a1a1a1; }
    </style>
    <clipPath id="window-clip">
      <rect x="2" y="2" width="896" height="141" rx="10" ry="10" />
    </clipPath>
  </defs>

  <rect x="2" y="2" width="896" height="141" rx="10" ry="10" fill="#0A0A0A" />

  <g clip-path="url(#window-clip)">
    <!-- Barra de título -->
    <rect x="2" y="2" width="896" height="36" fill="#111111" />
    
    <!-- Título à esquerda -->
    <text x="22" y="24" text-anchor="start" class="font-title">gfialhob@github: ~</text>

    <!-- Botões da janela à direita -->
    <circle cx="830" cy="19" r="6" fill="#8b949e" />
    <circle cx="850" cy="19" r="6" fill="#8b949e" />
    <path d="M 868 15 L 876 23 M 876 15 L 868 23" stroke="#8b949e" stroke-width="2" stroke-linecap="round" />

    <!-- Conteúdo -->
    <g class="font-code">
      <text x="22" y="68">
        <tspan class="prompt">gfialhob@github:~$</tspan>
        <tspan class="cmd"> ls projetos/</tspan>
      </text>
      <text x="22" y="94">
        <tspan class="dir">ozurac/</tspan>
        <tspan x="180" class="subtext">tema para VS Code</tspan>
      </text>
      <text x="22" y="118">
        <tspan class="dir">em-construcao/</tspan>
        <tspan x="180" class="subtext">automação para Linux</tspan>
      </text>
    </g>
  </g>

  <rect x="2" y="2" width="896" height="141" rx="10" ry="10" fill="none" stroke="#00995d" stroke-width="1" />
</svg>