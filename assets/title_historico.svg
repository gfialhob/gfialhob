<svg width="900" height="54" viewBox="0 0 900 54" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 16px; font-weight: 700; }
      .num { fill: #00995D; }
      .slash { fill: #6e7681; }
