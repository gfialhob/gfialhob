    <linearGradient id="fade-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00995D" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#5e8571" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00995D" stop-opacity="0" />
